name: CI

on:
  push:
    branches: [ master, main, part-2 ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4 
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RaceDay.Api/RaceDay.Api.csproj

      - name: Build
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal