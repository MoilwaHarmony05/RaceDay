name: Build RaceDay Projects

on:
  push:
    branches: [ "main", "master", "part-3" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build API
      working-directory: ./RaceDay.Api
      run: dotnet build

    - name: Build MVC
      working-directory: ./RaceDay.Web
      run: dotnet build